name: Deploy Chrome Extension

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Incrementar versão no manifest.json
        id: update_version
        run: |
          node -e "
            const fs = require('fs');
            const file = './manifest.json';
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));

            let parts = manifest.version.split('.').map(Number);
            parts[parts.length - 1] += 1;
            manifest.version = parts.join('.');

            fs.writeFileSync(file, JSON.stringify(manifest, null, 2));
            console.log('NOVA_VERSAO=' + manifest.version);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + manifest.version + '\n');
          "

      - name: Commit da nova versão e Criação da Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_VER="v${{ steps.update_version.outputs.version }}"

          git add manifest.json
          git commit -m "chore(release): bump version to $NEW_VER [skip ci]"

          git tag $NEW_VER
          git push origin main --follow-tags

      - name: Build da extensão (se necessário)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
            echo "✓ Build concluído"
          else
            echo "✓ Projeto vanilla - usando arquivos fonte"
          fi

      - name: Criar arquivo ZIP
        run: |
          if [ -d dist ]; then
            # Se houver pasta dist (projeto com build), zipar o conteúdo dela
            cd dist && zip -r ../extension.zip . && cd ..
            echo "✓ ZIP criado de dist/"
          else
            # Projeto vanilla - zipar apenas arquivos necessários da raiz
            zip -r extension.zip \
              manifest.json \
              background.js \
              popup.html \
              icons/ \
              -x "*.git*" "*.github*" "node_modules/*" "*.zip" "*.md"
            echo "✓ ZIP criado da raiz"
          fi

      - name: Upload para Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          file-path: "extension.zip"
          publish: false
