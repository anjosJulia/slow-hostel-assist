<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Slow Hostel Assist</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/panel.css" />
  </head>
  <body>
    <header class="panel-header">
      <img class="panel-header__symbol" src="icons/symbol.png" alt="Slow Hostel Assist" />
    </header>

    <nav class="mode-selector" aria-label="Tipo de template">
      <div class="mode-group">
        <h2 class="mode-group__label">Reserva</h2>
        <div class="mode-group__options">
          <button
            type="button"
            class="mode-tile is-active"
            id="btn-select-quote"
            data-icon="quote"
          >
            <span class="mode-tile__label">Orçamento</span>
          </button>
          <button
            type="button"
            class="mode-tile"
            id="btn-select-pre-reservation"
            data-icon="card"
          >
            <span class="mode-tile__label">Pré-reserva</span>
          </button>
        </div>
      </div>
      <div class="mode-group">
        <h2 class="mode-group__label">Operação da casa</h2>
        <div class="mode-group__options">
          <button
            type="button"
            class="mode-tile"
            id="btn-select-breakfast"
            data-icon="coffee"
          >
            <span class="mode-tile__label">Café</span>
          </button>
          <button
            type="button"
            class="mode-tile"
            id="btn-select-checkin-tomorrow"
            data-icon="checkin"
          >
            <span class="mode-tile__label">Check-in</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="panel-body" id="panel-body">
      <label class="option-toggle" id="option-show-discount">
        <input type="checkbox" id="checkbox-show-discount" />
        <span class="option-toggle__label">Exibir desconto para o hóspede</span>
      </label>

      <section
        class="notice is-hidden"
        id="notice"
        role="status"
        data-icon="alert"
        data-icon-size="20"
      >
        <div class="notice__content">
          <div class="notice__title" id="notice-title"></div>
          <div class="notice__body" id="notice-body"></div>
        </div>
      </section>

      <div class="notice-actions is-hidden" id="notice-actions">
        <button
          type="button"
          class="btn-outline btn-outline--accent"
          id="btn-open-hqbed"
          data-icon="external"
          data-icon-size="14"
        >
          Ir para o HQBed
        </button>
        <button
          type="button"
          class="btn-outline"
          id="btn-reload-tab"
          data-icon="refresh"
          data-icon-size="14"
        >
          Recarregar aba
        </button>
      </div>

      <section class="result-card is-hidden" id="result-card">
        <header class="result-card__header">
          <span class="tag" id="result-tag"></span>
          <div class="result-card__actions" id="result-card-actions">
            <button
              type="button"
              class="icon-button"
              id="btn-edit"
              data-icon="pencil"
              data-icon-size="15"
              title="Editar texto"
              aria-label="Editar texto"
            ></button>
            <button
              type="button"
              class="icon-button"
              id="btn-copy-inline"
              data-icon="copy"
              data-icon-size="15"
              title="Copiar"
              aria-label="Copiar"
            ></button>
          </div>
          <button type="button" class="link-button is-hidden" id="btn-discard">
            Descartar
          </button>
        </header>
        <textarea
          class="result-card__text"
          id="result-text"
          spellcheck="false"
          readonly
        ></textarea>
        <div class="skeleton is-hidden" id="result-skeleton" aria-hidden="true">
          <div class="skeleton__line"></div>
          <div class="skeleton__line"></div>
          <div class="skeleton__line"></div>
          <div class="skeleton__line"></div>
          <div class="skeleton__line"></div>
        </div>
      </section>

      <p class="panel-hint is-hidden" id="edit-hint">
        A edição vale só para este envio — o template original continua igual.
      </p>

      <div
        class="loading-note is-hidden"
        id="loading-note"
        data-icon="sparkle"
        data-icon-size="14"
      >
        <span id="loading-note-label"></span>
      </div>

      <div
        class="feedback is-hidden"
        id="feedback"
        role="status"
        data-icon="check"
        data-icon-size="16"
      >
        <span id="feedback-label"></span>
      </div>

      <section class="checkin-section is-hidden" id="checkin-section">
        <div class="guest-list-heading">
          <span class="guest-list-heading__title">Chegam amanhã</span>
          <span class="guest-list-heading__meta" id="guest-list-meta"></span>
        </div>
        <div class="guest-list" id="guest-list"></div>
      </section>

      <div class="panel-spacer"></div>

      <p class="panel-hint" id="panel-hint">
        Abra a reserva no HQBed e a gente monta o texto.
      </p>
    </main>

    <footer class="panel-footer">
      <button type="button" class="btn-primary" id="btn-primary">
        <span class="btn-primary__icon" id="btn-primary-icon"></span>
        <span id="btn-primary-label">Gerar template</span>
      </button>
      <button type="button" class="btn-quiet is-hidden" id="btn-secondary">
        <span class="btn-quiet__icon" id="btn-secondary-icon"></span>
        <span id="btn-secondary-label"></span>
      </button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
